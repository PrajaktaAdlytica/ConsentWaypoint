<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">A receipt keeps the reason.</title><desc id="desc">Anatomy of a simulated decision receipt: source, context, decision, basis and execution. No output provenance is invented.</desc><rect width="800" height="480" fill="#D8CEF2"/><g font-family="Arial,sans-serif"><text x="32" y="36" fill="#202522" font-size="11" font-weight="400">CONSENT WAYPOINT / CONCEPT PREVIEW</text><text x="32" y="82" fill="#202522" font-size="28" font-weight="600">A receipt keeps the reason.</text><rect x="32" y="130" width="736" height="270" rx="10" fill="#FFFEFA"/><text x="52" y="165" fill="#202522" font-size="14" font-weight="400">Source</text><text x="252" y="165" fill="#202522" font-size="17" font-weight="600">LIC-17 / Atlas Reference</text><path d="M52,179 L747,179" fill="none" stroke="#CDD3CB" stroke-width="1.5"/><text x="52" y="210" fill="#202522" font-size="14" font-weight="400">Context</text><text x="252" y="210" fill="#202522" font-size="17" font-weight="600">External inference / research</text><path d="M52,224 L747,224" fill="none" stroke="#CDD3CB" stroke-width="1.5"/><text x="52" y="255" fill="#202522" font-size="14" font-weight="400">Decision</text><text x="252" y="255" fill="#202522" font-size="17" font-weight="600">Requires counsel</text><path d="M52,269 L747,269" fill="none" stroke="#CDD3CB" stroke-width="1.5"/><text x="52" y="300" fill="#202522" font-size="14" font-weight="400">Basis</text><text x="252" y="300" fill="#202522" font-size="17" font-weight="600">External-use scope unresolved</text><path d="M52,314 L747,314" fill="none" stroke="#CDD3CB" stroke-width="1.5"/><text x="52" y="345" fill="#202522" font-size="14" font-weight="400">Execution</text><text x="252" y="345" fill="#202522" font-size="17" font-weight="600">Not executed / Output: none</text><path d="M52,359 L747,359" fill="none" stroke="#CDD3CB" stroke-width="1.5"/><text x="32" y="453" fill="#202522" font-size="11" font-weight="400">DEMO — SYNTHETIC DATA · NO EXECUTIONS</text></g></svg>