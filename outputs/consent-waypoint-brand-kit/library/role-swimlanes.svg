<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Three owners. Explicit handoffs.</title><desc id="desc">Workflow illustration: data owner defines use, counsel reviews terms, engineer runs a shadow evaluation. Handoffs do not imply automatic approval.</desc><rect width="800" height="480" fill="#D8CEF2"/><g font-family="Arial,sans-serif"><text x="32" y="36" fill="#202522" font-size="11" font-weight="400">CONSENT WAYPOINT / CONCEPT PREVIEW</text><text x="32" y="82" fill="#202522" font-size="28" font-weight="600">Three owners. Explicit handoffs.</text><rect x="32" y="136" width="736" height="70" rx="10" fill="#D8CEF2"/><text x="50" y="165" fill="#202522" font-size="18" font-weight="600">Data owner</text><text x="265" y="165" fill="#202522" font-size="17" font-weight="400">Defines source and intended use</text><text x="265" y="188" fill="#202522" font-size="12" font-weight="400">01 / intake</text><rect x="32" y="224" width="736" height="70" rx="10" fill="#FFFEFA"/><text x="50" y="253" fill="#202522" font-size="18" font-weight="600">Counsel</text><text x="265" y="253" fill="#202522" font-size="17" font-weight="400">Approves scope or records ambiguity</text><text x="265" y="276" fill="#202522" font-size="12" font-weight="400">02 / review</text><rect x="32" y="312" width="736" height="70" rx="10" fill="#DDE7DC"/><text x="50" y="341" fill="#202522" font-size="18" font-weight="600">Engineer</text><text x="265" y="341" fill="#202522" font-size="17" font-weight="400">Runs shadow evaluation; no execution</text><text x="265" y="364" fill="#202522" font-size="12" font-weight="400">03 / compare</text><text x="32" y="453" fill="#202522" font-size="11" font-weight="400">DEMO — SYNTHETIC DATA · NO EXECUTIONS</text></g></svg>