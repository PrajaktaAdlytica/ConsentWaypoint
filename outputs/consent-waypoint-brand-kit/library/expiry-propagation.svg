<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Trace the follow-up, too.</title><desc id="desc">Proposed expiry coordination: flag affected records, assign follow-up, verify outcomes. Does not promise downstream deletion.</desc><rect width="800" height="480" fill="#F6F3EC"/><g font-family="Arial,sans-serif"><text x="32" y="36" fill="#202522" font-size="11" font-weight="400">CONSENT WAYPOINT / CONCEPT PREVIEW</text><text x="32" y="82" fill="#202522" font-size="28" font-weight="600">Trace the follow-up, too.</text><rect x="32" y="165" width="220" height="76" rx="10" fill="#D8CEF2"/><text x="50" y="195" fill="#202522" font-size="19" font-weight="600">License expires</text><text x="50" y="220" fill="#202522" font-size="13" font-weight="400">Owner confirms date</text><path d="M255,203 L320,203" fill="none" stroke="#B8422B" stroke-width="1.5"/><path d="M313,198 L320,203 L313,208" fill="none" stroke="#B8422B" stroke-width="1.5"/><text x="262.5" y="191" fill="#202522" font-size="12" font-weight="400">flag</text><rect x="330" y="165" width="205" height="76" rx="10" fill="#DDE7DC"/><text x="348" y="195" fill="#202522" font-size="19" font-weight="600">Affected records</text><text x="348" y="220" fill="#202522" font-size="13" font-weight="400">Inventory to review</text><path d="M538,203 L593,203" fill="none" stroke="#B8422B" stroke-width="1.5"/><path d="M586,198 L593,203 L586,208" fill="none" stroke="#B8422B" stroke-width="1.5"/><text x="540.5" y="191" fill="#202522" font-size="12" font-weight="400">assign</text><rect x="602" y="165" width="166" height="76" rx="10" fill="#FFF1CC"/><text x="620" y="195" fill="#202522" font-size="19" font-weight="600">Follow-up</text><text x="620" y="220" fill="#202522" font-size="13" font-weight="400">Track status</text><text x="32" y="320" fill="#202522" font-size="25" font-weight="600">Notification ≠ downstream deletion.</text><text x="32" y="356" fill="#202522" font-size="17" font-weight="400">Owners must verify what happened beyond the boundary.</text><text x="32" y="453" fill="#202522" font-size="11" font-weight="400">DEMO — SYNTHETIC DATA · NO EXECUTIONS</text></g></svg>