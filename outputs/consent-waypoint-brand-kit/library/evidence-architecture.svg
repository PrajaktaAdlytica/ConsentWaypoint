<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">From clause to request context.</title><desc id="desc">Proposed architecture: source evidence is cited by a human-approved rights record. A request check compares context to that record. Access entitlement is separate.</desc><rect width="800" height="480" fill="#F6F3EC"/><g font-family="Arial,sans-serif"><text x="32" y="36" fill="#202522" font-size="11" font-weight="400">CONSENT WAYPOINT / CONCEPT PREVIEW</text><text x="32" y="82" fill="#202522" font-size="28" font-weight="600">From clause to request context.</text><rect x="32" y="180" width="200" height="76" rx="10" fill="#D8CEF2"/><text x="50" y="210" fill="#202522" font-size="19" font-weight="600">Source evidence</text><text x="50" y="235" fill="#202522" font-size="13" font-weight="400">Clause + review status</text><path d="M234,218 L298,218" fill="none" stroke="#B8422B" stroke-width="1.5"/><path d="M291,213 L298,218 L291,223" fill="none" stroke="#B8422B" stroke-width="1.5"/><text x="241.0" y="206" fill="#202522" font-size="12" font-weight="400">cite</text><rect x="305" y="180" width="210" height="76" rx="10" fill="#D8CEF2"/><text x="323" y="210" fill="#202522" font-size="19" font-weight="600">Rights record</text><text x="323" y="235" fill="#202522" font-size="13" font-weight="400">Human-approved scope</text><path d="M518,218 L577,218" fill="none" stroke="#B8422B" stroke-width="1.5"/><path d="M570,213 L577,218 L570,223" fill="none" stroke="#B8422B" stroke-width="1.5"/><text x="522.5" y="206" fill="#202522" font-size="12" font-weight="400">check</text><rect x="585" y="180" width="183" height="76" rx="10" fill="#DDE7DC"/><text x="603" y="210" fill="#202522" font-size="19" font-weight="600">Request check</text><text x="603" y="235" fill="#202522" font-size="13" font-weight="400">Purpose + destination</text><text x="32" y="325" fill="#202522" font-size="21" font-weight="400">Ambiguous terms remain questions for counsel.</text><text x="32" y="362" fill="#202522" font-size="16" font-weight="400">An access entitlement is a separate prerequisite.</text><text x="32" y="453" fill="#202522" font-size="11" font-weight="400">DEMO — SYNTHETIC DATA · NO EXECUTIONS</text></g></svg>