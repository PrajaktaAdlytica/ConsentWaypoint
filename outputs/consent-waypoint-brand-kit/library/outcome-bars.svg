<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Three outcomes. Twelve evaluations.</title><desc id="desc">Allow: 4. Requires counsel: 4. Deny: 4. Counts of synthetic evaluations, not executed requests.</desc><rect width="800" height="480" fill="#F6F3EC"/><g font-family="Arial,sans-serif"><text x="32" y="36" fill="#202522" font-size="11" font-weight="400">CONSENT WAYPOINT / CONCEPT PREVIEW</text><text x="32" y="82" fill="#202522" font-size="28" font-weight="600">Three outcomes. Twelve evaluations.</text><text x="32" y="175" fill="#202522" font-size="17" font-weight="400">Allow</text><rect x="215" y="150" width="448" height="36" rx="4" fill="#226043"/><text x="685" y="176" fill="#202522" font-size="18" font-weight="600">4 / 12</text><text x="32" y="261" fill="#202522" font-size="17" font-weight="400">Requires counsel</text><rect x="215" y="236" width="448" height="36" rx="4" fill="#79500C"/><text x="685" y="262" fill="#202522" font-size="18" font-weight="600">4 / 12</text><text x="32" y="347" fill="#202522" font-size="17" font-weight="400">Deny</text><rect x="215" y="322" width="448" height="36" rx="4" fill="#942F32"/><text x="685" y="348" fill="#202522" font-size="18" font-weight="600">4 / 12</text><text x="215" y="415" fill="#202522" font-size="12" font-weight="400">0</text><text x="657" y="415" fill="#202522" font-size="12" font-weight="400">4 evaluations</text><text x="32" y="453" fill="#202522" font-size="11" font-weight="400">DEMO — SYNTHETIC DATA · NO EXECUTIONS</text></g></svg>